name: Сборка Android APK (WiFi Expert)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Позволяет запускать сборку вручную в 1 клик на GitHub

jobs:
  build-apk:
    name: Компиляция APK для Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Настройка Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Настройка Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Настройка Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Установка NPM зависимостей
        run: npm install

      - name: 6. Сборка веб-приложения (Vite Production Build)
        run: npm run build

      - name: 7. Инициализация и синхронизация Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 8. Добавление разрешений для Wi-Fi в AndroidManifest.xml
        run: |
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            # Разрешаем прямой доступ к шлюзу и HTTP локальной сети без блокировок
            sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST_FILE" || true
          fi

      - name: 9. Компиляция APK файла через Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 10. Поиск скомпилированного APK файла
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          echo "Найден APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 11. Выгрузка готового APK в артефакты GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: WiFiExpert-Android-Debug
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: 12. Итог сборки в сводке GitHub
        run: |
          echo "### 🚀 Сборка Android APK успешно завершена!" >> $GITHUB_STEP_SUMMARY
          echo "APK файл готов к установке на смартфон монтажника/сервисника." >> $GITHUB_STEP_SUMMARY
          echo "Скачайте артефакт **WiFiExpert-Android-Debug.zip** в разделе Artifacts выше." >> $GITHUB_STEP_SUMMARY
